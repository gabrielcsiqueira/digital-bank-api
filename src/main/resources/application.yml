spring:
  application:
    name: digital-bank-api

  datasource:
    url: jdbc:postgresql://localhost:5432/digitalbank
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080
  error:
    include-message: always
  servlet:
    context-path: /api